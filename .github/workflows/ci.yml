name: CI

on:
  push:
    branches: [master]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      # Runtime + test dependencies only. The vision stack (torch/ultralytics)
      # is optional at runtime and lazily imported; the failure-path tests only
      # need OpenCV for video decoding.
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install fastapi uvicorn pydantic python-docx pytest httpx numpy pypdf beautifulsoup4 python-multipart openpyxl opencv-python-headless

      - name: Run test suite
        run: python -m pytest backend/tests -q
