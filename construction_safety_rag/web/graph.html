<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>施工安全知识图谱 - 施工安全证据助手</title>
    <script type="text/javascript" src="https://unpkg.com/vis-network/standalone/umd/vis-network.min.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            display: flex;
            height: 100vh;
        }

        /* 左侧控制面板 */
        .control-panel {
            width: 280px;
            background: #2d2d2d;
            color: #fff;
            padding: 20px;
            display: flex;
            flex-direction: column;
        }
        .control-panel h1 {
            font-size: 18px;
            margin-bottom: 8px;
        }
        .control-panel p {
            font-size: 12px;
            color: #999;
            margin-bottom: 20px;
        }
        .search-box {
            margin-bottom: 16px;
        }
        .search-row { display: flex; gap: 6px; }
        .search-box input {
            width: 100%;
            padding: 10px;
            border: none;
            border-radius: 6px;
            font-size: 13px;
        }
        .search-row button {
            flex: 0 0 54px;
            border: none;
            border-radius: 6px;
            color: #fff;
            background: #4a90d9;
            cursor: pointer;
            font-size: 12px;
        }
        .search-hint { margin: 7px 0 0 !important; color: #777 !important; font-size: 11px !important; }
        .legend {
            margin-top: 20px;
        }
        .legend h3 {
            font-size: 14px;
            margin-bottom: 10px;
        }
        .legend-item {
            display: flex;
            align-items: center;
            margin: 6px 0;
            font-size: 13px;
        }
        .legend-dot {
            width: 12px;
            height: 12px;
            border-radius: 50%;
            margin-right: 8px;
        }
        .back-btn {
            margin-top: auto;
            padding: 10px;
            background: #4a90d9;
            color: #fff;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-size: 14px;
            text-decoration: none;
            text-align: center;
        }

        /* 右侧图谱区域 */
        .graph-container {
            flex: 1;
            background: #1a1a2e;
            position: relative;
        }
        #mynetwork {
            width: 100%;
            height: 100%;
        }

        /* 节点详情弹窗 */
        .node-detail {
            position: absolute;
            right: 20px;
            top: 20px;
            width: 280px;
            background: rgba(255,255,255,0.95);
            border-radius: 8px;
            padding: 16px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.3);
            display: none;
        }
        .node-detail h3 {
            font-size: 16px;
            margin-bottom: 8px;
            color: #333;
        }
        .node-detail .type {
            font-size: 12px;
            color: #666;
            margin-bottom: 12px;
        }
        .node-detail .relations {
            font-size: 13px;
            color: #444;
            line-height: 1.6;
        }
        .source-ref { margin-top: 10px; padding-top: 8px; border-top: 1px solid #e5e7eb; font-size: 11px; line-height: 1.5; }
        .source-ref a { color: #2f74b5; text-decoration: none; }
        .source-ref a:hover { text-decoration: underline; }
        .close-btn {
            position: absolute;
            right: 12px;
            top: 12px;
            cursor: pointer;
            font-size: 18px;
            color: #999;
        }

        /* 类型颜色配置 */
        .type-DOCUMENT { background: #4ecdc4; }
        .type-CLAUSE { background: #6c5ce7; }
        .type-HAZARD { background: #ff6b6b; }
        .type-RISK { background: #e17055; }
        .type-OPERATION { background: #ffd93d; }
        .type-EQUIPMENT { background: #00b894; }
        .type-PPE { background: #0984e3; }
        .type-ROLE { background: #a29bfe; }
        .type-LOCATION { background: #74b9ff; }
        .type-CONCEPT { background: #74b9ff; }
        .type-OTHER { background: #95a5a6; }
    </style>
</head>
<body>
    <!-- 左侧控制面板 -->
    <div class="control-panel">
        <h1>知识图谱</h1>
        <p>施工安全法规与隐患关系图谱</p>
        
        <div class="search-box">
            <div class="search-row">
                <input type="text" id="searchInput" placeholder="输入实体或条款号" onkeydown="if(event.key === 'Enter') searchNode()">
                <button onclick="searchNode()">定位</button>
            </div>
            <p class="search-hint">例如：安全帽、重大事故隐患、第二十五条</p>
        </div>

        <div class="legend">
            <h3>实体类型</h3>
            <div class="legend-item"><div class="legend-dot type-DOCUMENT"></div>法规文件 (DOCUMENT)</div>
            <div class="legend-item"><div class="legend-dot type-CLAUSE"></div>条款 (CLAUSE)</div>
            <div class="legend-item"><div class="legend-dot type-HAZARD"></div>危险源 (HAZARD)</div>
            <div class="legend-item"><div class="legend-dot type-OPERATION"></div>作业 (OPERATION)</div>
            <div class="legend-item"><div class="legend-dot type-PPE"></div>防护用品 (PPE)</div>
            <div class="legend-item"><div class="legend-dot type-ROLE"></div>责任岗位 (ROLE)</div>
            <div class="legend-item"><div class="legend-dot type-CONCEPT"></div>安全概念 (CONCEPT)</div>
        </div>

        <a href="/" class="back-btn">← 返回聊天</a>
    </div>

    <!-- 右侧图谱区域 -->
    <div class="graph-container">
        <div id="mynetwork"></div>
        <div class="node-detail" id="nodeDetail">
            <span class="close-btn" onclick="closeDetail()">×</span>
            <h3 id="detailName"></h3>
            <div class="type" id="detailType"></div>
            <div class="relations" id="detailRelations">
                点击节点查看关联关系
            </div>
        </div>
    </div>

    <script>
        // 节点颜色映射
        const colorMap = {
            "DOCUMENT": "#4ecdc4",
            "CLAUSE": "#6c5ce7",
            "HAZARD": "#ff6b6b",
            "RISK": "#e17055",
            "OPERATION": "#ffd93d",
            "EQUIPMENT": "#00b894",
            "PPE": "#0984e3",
            "ROLE": "#a29bfe",
            "LOCATION": "#74b9ff",
            "CONCEPT": "#74b9ff",
            "OTHER": "#95a5a6"
        };

        let network = null;
        let nodes = null;
        let edges = null;
        let currentCenter = null;

        // 从API加载图谱数据
        async function loadGraphData(entityName) {
            let url = '/api/graph?depth=2';
            if (entityName) {
                url += '&entity=' + encodeURIComponent(entityName);
            }

            const res = await fetch(url);
            const data = await res.json();
            currentCenter = data.center || entityName || null;

            if (!data.nodes || data.nodes.length === 0) {
                alert('未找到实体「' + entityName + '」，请换个关键词试试');
                return;
            }

            // 转换节点数据
            const nodesArray = data.nodes.map(n => ({
                id: n.id,
                label: n.label,
                group: n.group,
                color: {
                    background: colorMap[n.group] || "#95a5a6",
                    border: "#fff",
                    highlight: {
                        background: colorMap[n.group] || "#95a5a6",
                        border: "#fff"
                    }
                },
                font: { color: "#fff", size: 15, face: "Microsoft YaHei" },
                shape: "dot",
                size: 25
            }));

            // 转换边数据
            const edgesArray = data.edges.map(e => ({
                from: e.from,
                to: e.to,
                // “涉及”是图谱中最常见的通用关系，保留在悬浮信息中，避免默认画面被重复文字遮挡。
                label: e.label === "涉及" ? "" : e.label,
                title: e.label,
                arrows: "to",
                color: { color: "#555", highlight: "#4a90d9" },
                font: { size: 10, color: "#aaa", background: "#1a1a2e" }
            }));

            // 更新数据集
            nodes.clear();
            edges.clear();
            nodes.add(nodesArray);
            edges.add(edgesArray);
        }

        // 初始化图谱
        function initGraph() {
            nodes = new vis.DataSet();
            edges = new vis.DataSet();

            const container = document.getElementById("mynetwork");
            const data = { nodes, edges };
            const options = {
                layout: {
                    improvedLayout: true
                },
                physics: {
                    barnesHut: {
                        gravitationalConstant: -3000,
                        springLength: 150
                    }
                },
                interaction: {
                    hover: true,
                    tooltipDelay: 200
                }
            };

            network = new vis.Network(container, data, options);

            // 节点点击事件
            network.on("click", function(params) {
                if (params.nodes.length > 0) {
                    const nodeId = params.nodes[0];
                    const node = nodes.get(nodeId);
                    showNodeDetail(nodeId, node);
                }
            });

            // 加载初始数据（不指定实体，返回中心节点）
            loadGraphData();
        }

        // 显示节点详情
        function showNodeDetail(nodeId, node) {
            document.getElementById("detailName").textContent = node.label;
            const aliases = node.aliases && node.aliases.length ? ` · 别名：${node.aliases.join('、')}` : '';
            const chunks = node.source_chunks && node.source_chunks.length ? ` · 来源 Chunk：${node.source_chunks.length} 个` : '';
            document.getElementById("detailType").textContent = node.group + aliases + chunks;
            
            // 查找关联关系
            const allEdges = edges.get();
            const relations = allEdges.filter(e => e.from === nodeId || e.to === nodeId);
            let html = "";
            relations.forEach(r => {
                const otherId = r.from === nodeId ? r.to : r.from;
                const otherNode = nodes.get(otherId);
                if (otherNode) {
                    const relationLabel = r.title || r.label || "相关";
                    if (r.from === nodeId) {
                        html += `<div>→ ${relationLabel} → <b>${otherNode.label}</b></div>`;
                    } else {
                        html += `<div>← ${relationLabel} ← <b>${otherNode.label}</b></div>`;
                    }
                }
            });
            document.getElementById("detailRelations").innerHTML = html || "暂无关联";
            if (node.source_refs && node.source_refs.length) {
                const refs = node.source_refs.map(ref => {
                    const label = `${escapeHtml(ref.title || '施工安全资料')} ${escapeHtml(ref.section || '')}`;
                    return ref.source_url
                        ? `<div class="source-ref">原文：<a href="${escapeAttr(ref.source_url)}" target="_blank" rel="noopener">${label} ↗</a></div>`
                        : `<div class="source-ref">来源：${label}</div>`;
                }).join('');
                document.getElementById("detailRelations").innerHTML += refs;
            }
            document.getElementById("nodeDetail").style.display = "block";
        }

        function escapeHtml(value) {
            return String(value).replace(/[&<>"']/g, ch => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[ch]));
        }

        function escapeAttr(value) {
            return escapeHtml(value).replace(/`/g, '&#096;');
        }

        function closeDetail() {
            document.getElementById("nodeDetail").style.display = "none";
        }

        // 搜索节点
        async function searchNode() {
            const keyword = document.getElementById("searchInput").value.trim();
            if (!keyword) return;
            
            // 按回车或点击“定位”后加载实体子图，避免输入半截关键词时频繁刷新。
            await loadGraphData(keyword);
            
            // 条款号可能是别名，使用 API 返回的实际展示实体定位。
            const focusId = currentCenter || keyword;
            const node = nodes.get(focusId);
            if (node) {
                // 聚焦到该节点
                network.focus(focusId, { scale: 1.2, animation: true });
                network.selectNodes([focusId]);
                showNodeDetail(focusId, node);
            }
        }

        // 页面加载完成后初始化
        window.onload = function() {
            initGraph();
        };
    </script>
</body>
</html>
